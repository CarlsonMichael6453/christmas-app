name: Deploy GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Export web
        run: npx expo export -p web
        env:
          EXPO_NO_TELEMETRY: "1"
          EXPO_PUBLIC_SUPABASE_URL: https://lqkffrqtkykuirarnrkq.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_GJGsmtk47WBbzXwn5fPSUg_NJHSjzSK

      - name: Add Pages routing files
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Publish gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cd dist
          git init -b gh-pages
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Deploy web build"
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git config http.https://github.com/.extraheader "AUTHORIZATION: bearer ${GITHUB_TOKEN}"
          git push --force origin gh-pages
